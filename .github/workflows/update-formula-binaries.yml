# Update Formula/aivcs.rb to pour prebuilt release binaries for a given tag.
#
# Trigger: workflow_dispatch with version (e.g. 0.4.3), or repository_dispatch
# from aivcs-io/aivcs after a release (client_payload.version).

name: update-formula-binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "AIVCS version without leading v (e.g. 0.4.3)"
        required: true
        type: string
  repository_dispatch:
    types: [aivcs-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            V="${{ github.event.client_payload.version }}"
          else
            V="${{ inputs.version }}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Fetch SHA256SUMS and rewrite formula
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/aivcs-io/aivcs/releases/download/${TAG}/SHA256SUMS" -o SHA256SUMS
          python3 <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          sums = pathlib.Path("SHA256SUMS").read_text()

          def sha(name: str) -> str:
              m = re.search(rf"^([0-9a-f]{{64}})\s+{re.escape(name)}\s*$", sums, re.M)
              if not m:
                  raise SystemExit(f"missing {name} in SHA256SUMS")
              return m.group(1)

          d, la, lx = sha("aivcs-darwin-arm64"), sha("aivcs-linux-arm64"), sha("aivcs-linux-x86_64")
          text = f"""# typed: false
# frozen_string_literal: true

class Aivcs < Formula
  desc "AI Version Control System for Autonomous Agent Swarms"
  homepage "https://aivcs.io"
  version "{version}"
  license "Apache-2.0"

  # Prebuilt release binaries from https://github.com/aivcs-io/aivcs/releases

  on_macos do
    on_arm do
      url "https://github.com/aivcs-io/aivcs/releases/download/v#{{version}}/aivcs-darwin-arm64"
      sha256 "{d}"
    end
  end

  on_linux do
    on_arm do
      url "https://github.com/aivcs-io/aivcs/releases/download/v#{{version}}/aivcs-linux-arm64"
      sha256 "{la}"
    end
    on_intel do
      url "https://github.com/aivcs-io/aivcs/releases/download/v#{{version}}/aivcs-linux-x86_64"
      sha256 "{lx}"
    end
  end

  def install
    binary = if OS.mac?
      "aivcs-darwin-arm64"
    elsif Hardware::CPU.arm?
      "aivcs-linux-arm64"
    else
      "aivcs-linux-x86_64"
    end
    bin.install binary => "aivcs"
  end

  test do
    assert_match version.to_s, shell_output("#{{bin}}/aivcs --version")
  end
end
"""
          pathlib.Path("Formula/aivcs.rb").write_text(text)
          print(text)
          PY

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="formula-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add Formula/aivcs.rb
          if git diff --cached --quiet; then
            echo "no formula change"
            exit 0
          fi
          git commit -m "formula: pour aivcs ${VERSION} release binaries"
          git push -u origin "$BRANCH" --force
          if [ "$(gh pr list --head "$BRANCH" --json number --jq 'length')" != "0" ]; then
            exit 0
          fi
          gh pr create --title "formula: aivcs ${VERSION} (prebuilt binaries)" \
            --body "Pours \`aivcs\` ${VERSION} from [aivcs-io/aivcs v${VERSION} release assets](https://github.com/aivcs-io/aivcs/releases/tag/v${VERSION}) — no local Rust compile." \
            --base main --head "$BRANCH"
