# Supply-chain gate for Homebrew tap PRs (code-governance ci-cd-baseline §6).
# Blocks merge when release binaries fail checksum verification, secret scan,
# SBOM generation, or vulnerability policy.

name: tap-pr-gate

on:
  pull_request:
    paths:
      - Formula/**
      - .github/workflows/tap-pr-gate.yml

permissions:
  contents: read
  pull-requests: write

env:
  AIVCS_RELEASE_REPO: aivcs-io/aivcs
  GRYPE_FAIL_ON: high

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract formula version
        id: formula
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^  version ' Formula/aivcs.rb | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Homebrew audit (linux x86_64 pour)
        run: |
          set -euo pipefail
          brew install --formula Formula/aivcs.rb
          brew test Formula/aivcs.rb

      - name: Fetch release assets and verify SHA256SUMS
        env:
          TAG: ${{ steps.formula.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          curl -fsSL "https://github.com/${AIVCS_RELEASE_REPO}/releases/download/${TAG}/SHA256SUMS" -o SHA256SUMS
          for asset in aivcs-linux-x86_64 aivcs-linux-arm64 aivcs-darwin-arm64; do
            curl -fsSL "https://github.com/${AIVCS_RELEASE_REPO}/releases/download/${TAG}/${asset}" -o "release-assets/${asset}"
          done
          sha256sum -c SHA256SUMS

      - name: Secret scan — repository (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Secret scan — release binary strings (fail closed)
        run: |
          set -euo pipefail
          strings release-assets/aivcs-linux-x86_64 > binary.strings
          python3 <<'PY'
          import pathlib, re, sys

          patterns = [
              (r"gho_[A-Za-z0-9_]{20,}", "GitHub OAuth token"),
              (r"ghp_[A-Za-z0-9_]{20,}", "GitHub PAT"),
              (r"github_pat_[A-Za-z0-9_]{20,}", "GitHub fine-grained PAT"),
              (r"glpat-[A-Za-z0-9\-_]{20,}", "GitLab PAT"),
              (r"AKIA[0-9A-Z]{16}", "AWS access key id"),
              (r"sk-ant-[A-Za-z0-9\-_]{20,}", "Anthropic API key"),
              (r"AIza[0-9A-Za-z\-_]{30,}", "Google API key"),
              (r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----", "PEM private key"),
          ]
          text = pathlib.Path("binary.strings").read_text(errors="ignore")
          hits = []
          for pat, label in patterns:
              if re.search(pat, text):
                  hits.append(label)
          if hits:
              print("Credential-like material detected in release binary strings:", file=sys.stderr)
              for h in hits:
                  print(f"  - {h}", file=sys.stderr)
              sys.exit(1)
          print("binary strings scan: clean")
          PY

      - name: Generate SBOM (Syft / CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: release-assets/aivcs-linux-x86_64
          format: cyclonedx-json
          output-file: sbom-aivcs-linux-x86_64.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-aivcs-${{ steps.formula.outputs.version }}
          path: sbom-aivcs-linux-x86_64.cdx.json
          retention-days: 90

      - name: Vulnerability scan (Grype)
        uses: anchore/scan-action@v6
        id: grype
        with:
          sbom: sbom-aivcs-linux-x86_64.cdx.json
          fail-build: true
          severity-cutoff: high

      - name: Summarize gate results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.formula.outputs.version }}';
            const grype = '${{ steps.grype.outcome }}';
            const body = [
              '## Tap release gate',
              '',
              '| Check | Result |',
              '|-------|--------|',
              `| Formula version | \`${version}\` |`,
              '| SHA256SUMS verify | required pass |',
              '| gitleaks (repo) | required pass |',
              '| Binary strings secret scan | required pass |',
              '| SBOM (Syft CycloneDX) | artifact uploaded |',
              `| Grype (severity ≥ high) | ${grype} |`,
              '',
              'Governance: code-governance `ci-cd-baseline` §6 (SBOM + vuln scan).',
              'Private-info block: gitleaks + binary strings patterns (code-governance #1306).',
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
